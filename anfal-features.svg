<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Six built-in site behaviours shown as mini animated demos" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#253039"/><stop offset="0.5" stop-color="#4b4140"/><stop offset="1" stop-color="#8b2f27"/></linearGradient></defs>
<rect width="1000" height="340" rx="14" fill="#17191d"/><text x="500" y="28" text-anchor="middle" font-size="11" letter-spacing="8" fill="#c7a36a" font-weight="800" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">QUALITY CONTROL · BUILT-IN BEHAVIOURS</text><g><rect x="30" y="46" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="30" y="46" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(50,62)"><rect x="0" y="0" width="46" height="46" rx="3" fill="#c7a36a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.00;0.12;0.9;1" dur="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 18" keyTimes="0;0.00;0.12;0.9;1" dur="4s" repeatCount="indefinite"/></rect><rect x="54" y="0" width="46" height="46" rx="3" fill="#c7a36a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.27;0.9;1" dur="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 18" keyTimes="0;0.15;0.27;0.9;1" dur="4s" repeatCount="indefinite"/></rect><rect x="108" y="0" width="46" height="46" rx="3" fill="#c7a36a" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.42;0.9;1" dur="4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 18;0 18;0 0;0 0;0 18" keyTimes="0;0.30;0.42;0.9;1" dur="4s" repeatCount="indefinite"/></rect></g>
<text x="50" y="134" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Scroll reveal</text><text x="50" y="152" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Sections fade up as they enter view</text></g><g><rect x="350" y="46" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="350" y="46" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(370,62)"><rect x="0" y="0" width="150" height="16" fill="#17191d" stroke="#c7a36a" stroke-opacity="0.4"><animate attributeName="fill" values="#17191d00;#17191d00;#17191d;#17191d;#17191d00" keyTimes="0;0.2;0.4;0.8;1" dur="4s" repeatCount="indefinite"/></rect><rect x="0" y="22" width="150" height="6" fill="#8e918f" opacity="0.4"><animate attributeName="y" values="22;12;22" dur="4s" repeatCount="indefinite"/></rect><rect x="0" y="34" width="110" height="6" fill="#8e918f" opacity="0.3"/></g>
<text x="370" y="134" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Solid nav on scroll</text><text x="370" y="152" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Transparent at the top, solid after 24px</text></g><g><rect x="670" y="46" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="670" y="46" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(690,62)"><g stroke="#fff" stroke-width="5" stroke-linecap="round"><line x1="0" y1="8" x2="42" y2="8"><animate attributeName="y2" values="8;40;8" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/></line><line x1="0" y1="24" x2="42" y2="24"><animate attributeName="opacity" values="1;0;1" dur="3s" repeatCount="indefinite"/></line><line x1="0" y1="40" x2="42" y2="40"><animate attributeName="y2" values="40;8;40" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/></line></g><text x="62" y="30" font-size="12" fill="#c7a36a" font-family="Consolas, Menlo, 'Courier New', monospace">aria-expanded</text></g>
<text x="690" y="134" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Mobile menu</text><text x="690" y="152" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Hamburger swaps to an X, aria-expanded kept</text></g><g><rect x="30" y="186" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="30" y="186" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(50,202)"><rect x="0" y="6" width="64" height="32" rx="16" fill="#17191d" stroke="#c7a36a" stroke-width="2"/><circle cx="16" cy="22" r="11" fill="#c7a36a"><animate attributeName="cx" values="16;48;48;16" keyTimes="0;0.3;0.8;1" dur="4s" repeatCount="indefinite"/></circle><text x="84" y="28" font-size="12" fill="#c7a36a" font-family="Consolas, Menlo, 'Courier New', monospace">prefers-reduced-motion</text></g>
<text x="50" y="274" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Reduced motion respected</text><text x="50" y="292" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Reveals show instantly, transitions near-zero</text></g><g><rect x="350" y="186" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="350" y="186" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(370,202)"><rect x="0" y="0" width="64" height="46" rx="4" fill="#17191d" stroke="#8e918f" stroke-dasharray="4 4"/><rect x="0" y="0" width="64" height="46" rx="4" fill="url(#fb)" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.5;0.9;1" dur="4s" repeatCount="indefinite"/></rect><path d="M8 38 l14 -16 l10 10 l8 -8 l14 14z" fill="#8e918f" opacity="0.5"/><text x="82" y="28" font-size="12" fill="#c7a36a" font-family="Consolas, Menlo, 'Courier New', monospace">.hero-fallback</text></g>
<text x="370" y="274" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Hero fallback</text><text x="370" y="292" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">A gradient steps in if the photo is missing</text></g><g><rect x="670" y="186" width="300" height="122" rx="6" transform="translate(7,8)" fill="#c7a36a" opacity="0.22"/><rect x="670" y="186" width="300" height="122" rx="6" fill="#22262b" stroke="#c7a36a" stroke-width="1.5"/><g transform="translate(690,202)"><line x1="0" y1="23" x2="200" y2="23" stroke="#8e918f" stroke-dasharray="4 6"/><circle cx="0" cy="23" r="9" fill="#c7a36a"><animate attributeName="cx" values="0;200;200;0" keyTimes="0;0.5;0.8;1" calcMode="spline" keySplines="0.45 0 0.55 1;0 0 1 1;0.45 0 0.55 1" dur="4s" repeatCount="indefinite"/></circle><text x="0" y="52" font-size="11" fill="#c7a36a" font-family="Consolas, Menlo, 'Courier New', monospace">scroll-behavior: smooth</text></g>
<text x="690" y="274" font-size="14" font-weight="800" fill="#fff" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">Smooth anchors</text><text x="690" y="292" font-size="11.5" fill="#8e918f" font-family="DM Sans, Segoe UI, Helvetica, Arial, sans-serif">In-page links glide to each section</text></g></svg>